services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/detector.joblib
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
    restart: unless-stopped

  interfaz:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
